<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VocaBuilder</title>
  <meta name="theme-color" content="#f1f7f4">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VocaBuilder">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="A vocabulary study app with a short story for each lesson, Bangla meanings, example sentences, quizzes and spaced review.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&family=Noto+Sans+Bengali:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/vocabulary.css">
  <link rel="stylesheet" href="css/quiz-review.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/theme-mint.css">
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <div class="row1">
        <button class="ib" id="prev" data-act="prev" aria-label="Previous page">&#8249;</button>
        <button class="daybtn" id="daybtn" data-act="days" aria-label="Open the index"><span class="a" id="dn"></span><span class="b" id="dd"></span><span class="c">Index</span></button>
        <button class="ib" id="next" data-act="next" aria-label="Next page">&#8250;</button>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" data-act="tab" data-tab="learn">Learn</button>
        <button class="tab" role="tab" data-act="tab" data-tab="quiz">Quiz</button>
        <button class="tab" role="tab" data-act="tab" data-tab="review">Review <span class="badge" id="badge"></span></button>
        <button class="tab" role="tab" data-act="tab" data-tab="index">Index</button>
      </nav>
    </header>
    <main id="view"></main>
    <footer class="foot">Based on <i>VocaBuilder</i> by Farhad Hossain Masum &middot; <button data-act="about">About &amp; acknowledgement</button></footer>
  </div>
  <noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>

  <!-- 1. Data packs. Do not edit this block by hand: run  node tools/update-packs.js  after adding a pack file. -->
  <!-- PACKS:START -->
  <script src="js/data/pack-001-030.js"></script>
  <script src="js/data/pack-031-042.js"></script>
  <script src="js/data/pack-043-067.js"></script>
  <!-- PACKS:END -->

  <!-- 2. Core (no DOM) -->
  <script src="js/core/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/calendar.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/vocab.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/srs.js"></script>
  <script src="js/core/speech.js"></script>

  <!-- 3. Screens -->
  <script src="js/ui/header.js"></script>
  <script src="js/ui/learn.js"></script>
  <script src="js/ui/quiz.js"></script>
  <script src="js/ui/review.js"></script>
  <script src="js/ui/index.js"></script>
  <script src="js/ui/about.js"></script>

  <!-- 4. Start-up -->
  <script src="js/app.js"></script>

  <!-- 5. Offline + install support -->
  <script src="js/pwa.js"></script>
</body>
</html>
